    <!-- Deferred Third-Party Loader (GTM-5BV286F5, Leadsy, GoHighLevel)
         Loads immediately on first user interaction or 2s after page load so
         real visitors get 100% tracking & LiveChat while initial LCP/TBT stays near 0ms. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function () {
        var loaded = false;
        function loadThirdPartyTags() {
          if (loaded) return;
          loaded = true;
          ['pointerdown', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(function (evt) {
            window.removeEventListener(evt, loadThirdPartyTags);
          });

          // 1. Google Tag Manager (GTM-5BV286F5)
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var gtm = document.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5BV286F5';
          document.head.appendChild(gtm);

          // 2. Leadsy Visitor Identification Tag
          var leadsy = document.createElement('script');
          leadsy.id = 'vtag-ai-js';
          leadsy.async = true;
          leadsy.src = 'https://r2.leadsy.ai/tag.js';
          leadsy.setAttribute('data-pid', '1iKDbwnIEhjXkU4nY');
          leadsy.setAttribute('data-version', '062024');
          document.head.appendChild(leadsy);

          // 3. GoHighLevel / LeadConnector External Tracking SDK
          var ghl = document.createElement('script');
          ghl.async = true;
          ghl.src = 'https://clients.inceptivesdigital.com/js/external-tracking.js';
          ghl.setAttribute('data-tracking-id', 'tk_92e0fd793caf40fab8810a29eb837874');
          document.head.appendChild(ghl);
        }

        ['pointerdown', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(function (evt) {
          window.addEventListener(evt, loadThirdPartyTags, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          window.setTimeout(loadThirdPartyTags, 2000);
        });
      })();
    </script>
